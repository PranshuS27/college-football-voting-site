services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: football_votes
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d football_votes"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/football_votes
      SECRET_KEY: ${SECRET_KEY:-dev-key-change-in-production}
      FLASK_ENV: development
      COOKIE_SECURE: "false"
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app.py:/app/app.py
      - ./backend:/app/backend
      - ./docker_entrypoint.py:/app/docker_entrypoint.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      # Browser calls same-origin /api; Next proxies to the backend service
      INTERNAL_API_URL: http://backend:5000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
